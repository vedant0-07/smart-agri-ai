services:
  - type: web
    name: smart-agri-ai
    runtime: python
    rootDir: backend
    buildCommand: |
      pip install -r requirements.txt
      cd ../frontend && npm install && npm run build
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: TF_ENABLE_ONEDNN_OPTS
        value: "0"
      - key: CORS_ORIGINS
        value: "*"
    disk:
      name: agri-data
      mountPath: /opt/render/project/src/backend
      sizeGB: 1
